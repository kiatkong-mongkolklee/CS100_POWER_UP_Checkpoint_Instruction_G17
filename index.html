<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Learning Portfolio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>

<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <span class="navbar-brand">Learning Portfolio</span>
        </div>
    </nav>

    <main class="container my-4">
        <!-- Error area (Issue #4) -->
        <div id="error-toast" class="alert alert-danger d-none" role="alert"></div>

        <div class="row g-4">
            <!-- Create Portfolio form goes here -->
            <section class="col-lg-6" id="portfolio-section">
                <div class="card shadow-sm h-100">
                    <div class="card-header bg-primary text-white">
                        <h5 class="card-title mb-0">Create Portfolio</h5>
                    </div>
                    <div class="card-body">
                        <!-- เลือก / สลับ Portfolio -->
                        <div class="mb-3 pb-3 border-bottom">
                            <label for="portfolio-select" class="form-label fw-bold">Select Portfolio</label>
                            <select id="portfolio-select" class="form-select">
                                <option value="portfolio_1">Portfolio 1</option>
                                <option value="portfolio_2">Portfolio 2</option>
                            </select>
                        </div>

                        <form id="portfolio-profile-form" novalidate>
                            <div class="mb-3">
                                <label for="profile-name" class="form-label">Display Name</label>
                                <input type="text" class="form-control" id="profile-name" required>
                                <div class="invalid-feedback"></div>
                            </div>
                            <div class="mb-3">
                                <label for="what-i-enjoy" class="form-label">What I Enjoy</label>
                                <textarea class="form-control" id="what-i-enjoy" rows="2" required></textarea>
                                <div class="invalid-feedback"></div>
                            </div>
                            <div class="mb-3">
                                <label for="what-ive-tried" class="form-label">What I've Tried</label>
                                <textarea class="form-control" id="what-ive-tried" rows="2" required></textarea>
                                <div class="invalid-feedback"></div>
                            </div>
                            <div class="mb-3">
                                <label for="what-curious" class="form-label">What I'm Curious About</label>
                                <textarea class="form-control" id="what-curious" rows="2" required></textarea>
                                <div class="invalid-feedback"></div>
                            </div>
                            <button type="submit" class="btn btn-outline-primary w-100"></button>
                        </form>
                    </div>
                </div>
            </section>

            <!-- Add Item form goes here (Issue #3) -->
            <section class="col-lg-6" id="item-section">
            </section>
        </div>

        <hr class="my-5">

        <!-- Display area goes here (Issue #5) -->
        <section id="display-section">
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
